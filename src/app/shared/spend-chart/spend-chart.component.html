<section class="chart" *ngIf="days.length">
  <div class="chart-head">
    <h2 class="chart-title">{{ title }}</h2>
    <span class="chart-peak tnum" *ngIf="busiest">busiest ₹{{ busiest | number }}</span>
  </div>

  <div class="chart-plot">
    <div class="chart-day" *ngFor="let day of days" [class.today]="day.isToday"
      [class.empty]="!day.total"
      [attr.title]="(day.date | date: 'd MMM') + ' · ₹' + (day.total | number)">
      <span class="chart-bar" [style.height.%]="day.height"></span>
    </div>
  </div>

  <div class="chart-axis">
    <span class="tnum">{{ days[0].date | date: 'd MMM' }}</span>
    <span class="tnum">today</span>
  </div>
</section>
