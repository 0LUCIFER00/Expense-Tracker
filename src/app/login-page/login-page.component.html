<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <h1>Login</h1>
      <p class="subtitle">Sign in to manage your expenses</p>

      <p class="access-msg" *ngIf="accessMessage">{{ accessMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
          <small class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            Valid email is required
          </small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" formControlName="password" placeholder="Enter your password" />
          <small class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            Password must be at least 6 characters
          </small>
        </div>

        <button type="submit" [disabled]="loginForm.invalid">Login</button>
      </form>

      <p class="footer-text">
        Don't have an account?
        <a routerLink="/register">Register</a>
      </p>
    </div>
  </div>
</div>
