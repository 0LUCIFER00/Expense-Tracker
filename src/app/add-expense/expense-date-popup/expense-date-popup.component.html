<div class="overlay">
  <div class="popup">

    <h3>Confirm Expense Date</h3>

    @if (popupType === 'past') {
      <p>
        You selected a past date.
      </p>
    }

    @if (popupType === 'future') {
      <p>
        You selected a future date.
      </p>
    }

    <div class="btn-group">

      <button
        type="button"
        class="cancel-btn"
        (click)="cancel.emit()">
        Cancel
      </button>

      @if (canAddDirectly) {
        <button
          type="button"
          class="ok-btn"
          (click)="add.emit()">
          Add
        </button>
      }

      @if (!canAddDirectly) {
        <button
          type="button"
          class="admin-btn"
          (click)="adminPermission.emit()">
          Admin Permission
        </button>
      }

    </div>

  </div>
</div>
