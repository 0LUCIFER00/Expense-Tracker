<div class="register-page">
  <div class="register-container">
    <div class="register-card">
      <h1>Register</h1>
      <p class="subtitle">Create your account to manage expenses</p>

      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            id="name"
            type="text"
            formControlName="name"
            placeholder="Enter your full name"
          />
          <small class="error" *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid">
            Name must be at least 3 characters
          </small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
          />
          <small class="error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
            Valid email is required
          </small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Enter your password"
          />
          <small class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
            Password must be at least 6 characters
          </small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm your password"
          />
          <small class="error" *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid">
            Confirm password is required
          </small>
          <small
            class="error"
            *ngIf="registerForm.touched && registerForm.errors?.['passwordMismatch']"
          >
            Password and confirm password must match
          </small>
        </div>

        <button type="submit" [disabled]="registerForm.invalid">Register</button>
      </form>

      <p class="footer-text">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </div>
  </div>
</div>
