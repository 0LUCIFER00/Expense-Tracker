<header class="header" #headerEl>
  <div class="logo">Expense Tracker</div>

  <nav class="nav-links" [class.open]="menuOpen" id="primary-nav">
    <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Home</a>
    <a routerLink="/add-expense" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Add Expense</a>
    @if (showAddMoney) {
      <a routerLink="/add-money" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Add Income</a>
    }
    <a routerLink="/transactions" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Transactions</a>
    <a routerLink="/budgets" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Budgets</a>
    <a routerLink="/recurring" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
      Recurring
      @if (attention > 0) {
        <span class="nav-badge" [attr.aria-label]="attention + ' need attention'">{{ attention }}</span>
      }
    </a>
    @if (showBalanceManagement) {
      <a routerLink="/money" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Cash &amp; Accounts</a>
    }
  </nav>

  <div class="header-actions">

    <button class="theme-btn" type="button" (click)="toggleTheme()"
      [attr.aria-pressed]="theme.isDark"
      [attr.title]="theme.isDark ? 'Switch to light' : 'Switch to dark'"
      aria-label="Switch between light and dark">

      @if (theme.isDark) {
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.6v2.4M12 19v2.4M4.2 12H1.8M22.2 12h-2.4" />
          <path d="M5.9 5.9 7.6 7.6M16.4 16.4l1.7 1.7M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7" />
        </svg>
      }

      @if (!theme.isDark) {
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8Z" />
        </svg>
      }

    </button>

    <div class="profile-menu">

      <button class="profile-btn" type="button" [attr.title]="userName || null"
        [attr.aria-label]="userName ? 'Account menu, ' + userName : 'Account menu'" [attr.aria-expanded]="showProfileMenu"
        (click)="toggleProfileMenu()">

        @if (initials) {
          <span class="profile-initials" aria-hidden="true">{{ initials }}</span>
        } @else {
          <span class="profile-icon">👤</span>
        }

      </button>

      @if (showProfileMenu) {
        <div class="profile-dropdown" #profileMenu>
          <a routerLink="/profile" (click)="closeProfileMenu()">
            👤 My Profile
          </a>
          <a routerLink="/goals" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeProfileMenu()">
            💰 Savings Goals
          </a>
          <a routerLink="/settings" (click)="closeProfileMenu()">
            ⚙️ Settings
          </a>
          <a routerLink="/help_support" (click)="closeProfileMenu()">
            ❓ Help &amp; Support
          </a>
          <hr>
            <a href="javascript:void(0)" (click)="logout()">
              🚪 Logout
            </a>
          </div>
        }

      </div>

      <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-controls="primary-nav"
        [attr.aria-expanded]="menuOpen" (click)="toggleMenu()">

        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>

      </button>

    </div>
  </header>
