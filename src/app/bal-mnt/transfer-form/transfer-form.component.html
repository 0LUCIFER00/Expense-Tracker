<section class="transfer card" aria-labelledby="transfer-title">
  <div class="head">
    <h2 id="transfer-title">Transfer money</h2>
    <p>Between your own accounts. Not income or an expense, and never counted in budgets.</p>
  </div>

  <form class="grid" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="t-from">From</label>
      <select id="t-from" name="from" [(ngModel)]="fromId" (ngModelChange)="onFromChange()">
        @for (a of accounts; track a.id) {
          <option [value]="a.id">{{ a.category }}{{ a.balance !== null ? ' · ₹' + (a.balance | number: '1.0-2') : '' }}</option>
        }
      </select>
    </div>

    <button type="button" class="swap" aria-label="Swap from and to" title="Swap" (click)="swap()">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3" /></svg>
    </button>

    <div class="field">
      <label for="t-to">To</label>
      <select id="t-to" name="to" [(ngModel)]="toId" (ngModelChange)="clearMessages()">
        @for (a of destinations; track a.id) {
          <option [value]="a.id">{{ a.category }}{{ a.balance !== null ? ' · ₹' + (a.balance | number: '1.0-2') : '' }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="t-amount">Amount (₹)</label>
      <div class="amount-row">
        <input id="t-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01"
          [(ngModel)]="amount" (ngModelChange)="clearMessages()">
        @if (from?.balance) {
          <button type="button" class="all" (click)="useAll()">All</button>
        }
      </div>
    </div>

    <div class="field">
      <label for="t-date">Date</label>
      <input id="t-date" name="date" type="date" [max]="today" [disabled]="!canBackdate"
        [(ngModel)]="date" (ngModelChange)="clearMessages()">
    </div>

    <div class="field wide">
      <label for="t-desc">Description <span class="opt">(optional)</span></label>
      <input id="t-desc" name="description" maxlength="200" autocomplete="off"
        placeholder="ATM withdrawal, top up, savings…" [(ngModel)]="description">
    </div>

    <button type="submit" class="et-btn-primary go" [disabled]="busy">
      {{ busy ? 'Transferring…' : 'Transfer' }}
    </button>
  </form>

  @if (error) {
    <p class="msg err" role="alert">{{ error }}</p>
  } @else if (success) {
    <p class="msg ok" role="status">{{ success }}</p>
  }
</section>
