<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Sets the dark attribute before the first paint. Not inline: the server's
       content security policy refuses inline scripts. -->
  <script src="theme-init.js"></script>

  <!-- The design's typeface. Segoe UI stands in while it loads, and if it
       never does, so nothing depends on this request succeeding. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
</head>

</body>
</html>
